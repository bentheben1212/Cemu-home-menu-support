name: Dev AppImage (x64)

# Fast test builds for development branches: Linux x64 + AppImage only,
# with vcpkg binaries and compiler output cached between runs.
on:
  push:
    paths-ignore:
      - "*.md"
    branches:
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: dev-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_MAXSIZE: "2G"
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"
  CCACHE_BASEDIR: "${{ github.workspace }}"

jobs:
  appimage-x64:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: "recursive"
        fetch-depth: 0

    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y clang-15 cmake freeglut3-dev libgcrypt20-dev libglm-dev libgtk-3-dev libpulse-dev libsecret-1-dev libsystemd-dev libudev-dev nasm ninja-build libbluetooth-dev appstream ccache

    - name: Compute cache keys
      id: keys
      run: |
        echo "vcpkg=$(git -C dependencies/vcpkg rev-parse HEAD)-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_linux/**') }}" >> "$GITHUB_OUTPUT"

    # vcpkg's files cache is keyed by each package's ABI hash, so restoring an older cache is always safe
    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .vcpkg-cache
        key: vcpkg-linux-x64-${{ steps.keys.outputs.vcpkg }}
        restore-keys: |
          vcpkg-linux-x64-

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-linux-x64-${{ github.run_id }}
        restore-keys: |
          ccache-linux-x64-

    - name: Bootstrap vcpkg
      run: bash ./dependencies/vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: cmake
      run: |
        mkdir -p .vcpkg-cache
        cmake -S . -B build -DCMAKE_BUILD_TYPE=release \
          -DCMAKE_C_COMPILER=/usr/bin/clang-15 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-15 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp" \
          -G Ninja -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

    - name: Build Cemu
      run: |
        ccache -z
        cmake --build build
        ccache -s

    - name: Build AppImage
      run: |
        mv bin/Cemu_release bin/Cemu
        export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
        export DEPLOY_GTK_VERSION=3
        dist/linux/appimage.sh X64

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: cemu-appimage-x64
        path: artifacts
